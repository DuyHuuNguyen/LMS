

spring:
  config:
    activate:
      on-profile:
        - prod
  cloud:
    gateway:
      routes:

        - id: curriculum-service
          uri: http://${CURRICULUM_SERVICE_NAME}:${CURRICULUM_SERVICE_PORT}
          predicates:
            - Path=/curriculum-service/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://${USER_SERVICE_NAME}:${USER_SERVICE_PORT}
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}