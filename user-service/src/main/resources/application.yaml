spring:
  application:
    name: ${SPRING_APPLICATION_NAME:user-service}
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_user_service_lms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_TTL:600000ms}
  rabbitmq:
    port: ${RABBITMQ_PORT:5672}
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: smtp.gmail.com
    port: 587
    username: hotrotoyworld@gmail.com
    password: tknm zdhx fiox vazw
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

jwt:
  secretKey: ${JWT_SECRET_KEY:}
  accessTokenExpirationTime: ${JWT_ACCESS_TOKEN_EXPIRATION:259200000} # 3 days
  refreshTokenExpirationTime: ${JWT_REFRESH_TOKEN_EXPIRATION:2419200000} # 2 weeks
  resetPasswordTokenExpirationTime: ${JWT_RESET_PASSWORD_TOKEN_EXPIRATION:900000} # 15 minutes

rabbitmq:
  exchange-name: ${RABBITMQ_EXCHANGE_NAME:demo}
  user-mail-routing-key: ${RABBITMQ_USER_MAIL_ROUTING_KEY:demo}
  user-mail-queue: ${RABBITMQ_USER_MAIL_QUEUE:lms-queue}

  exchange-cache-data-name: ${RABBITMQ_EXCHANGE_CACHE_DATA_NAME:cache-lecturers-data}
  cache-data-routing-key: ${RABBITMQ_CACHE_DATA_ROUTING_KEY:cache-lecturers-data}
  cache-data-queue: ${RABBITMQ_CACHE_DATA_QUEUE:cache-data-queue}

server:
